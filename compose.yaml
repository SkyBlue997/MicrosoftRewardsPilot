services:
  microsoftrewardspilot:
    build: .
    container_name: microsoftrewardspilot
    restart: unless-stopped
    volumes:
      # 先复制示例配置：cp config/config.json.example config/config.json
      #                cp config/accounts.json.example config/accounts.json
      # 挂载目标必须和代码的读取路径一致：utils/Load.ts 读的是 process.cwd()/config/*.json，
      # 而容器里的 cwd 就是 Dockerfile 的 WORKDIR（/usr/src/microsoftrewardspilot）。
      - ./config/accounts.json:/usr/src/microsoftrewardspilot/config/accounts.json
      - ./config/config.json:/usr/src/microsoftrewardspilot/config/config.json
      - ./sessions:/usr/src/microsoftrewardspilot/sessions # Optional, saves your login session
    environment:
      - NODE_ENV=production
      # Prefer odd, non-round, spread-out hours over 9,16 so runs don't cluster at obvious times.
      - CRON_SCHEDULE=0 9,16 * * * # Customize your schedule, use crontab.guru for formatting
      - RUN_ON_START=true # Runs the script on container startup
      - TZ=Asia/Tokyo # Set your timezone for proper scheduling
      # Anti-detection: arm rebrowser's Runtime.enable patch (src/rebrowser-env.ts sets these as
      # defaults too; declared here so it's explicit/overridable in the deployed container).
      - REBROWSER_PATCHES_RUNTIME_FIX_MODE=addBinding
      - REBROWSER_PATCHES_UTILITY_WORLD_NAME=util
