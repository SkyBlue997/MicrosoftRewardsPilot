services:
  microsoftrewardspilot:
    build: .
    container_name: microsoftrewardspilot
    restart: unless-stopped
    volumes:
      ### 请先复制示例配置文件：cp config/*.example config/accounts.json && cp config/config.json.example config/config.json
      - ./config/accounts.json:/usr/src/microsoftrewardspilot/config/accounts.json
      - ./config/config.json:/usr/src/microsoftrewardspilot/config/config.json
      - ./sessions:/usr/src/microsoftrewardspilot/sessions # 保存登录会话
    environment:
      - NODE_ENV=production
      # Prefer odd, non-round, spread-out hours so runs don't cluster at obvious times. The 21:00 slot
      # catches read-to-earn on days the offer isn't in the feed yet at the morning/afternoon runs.
      - CRON_SCHEDULE=0 9,16,21 * * * # Customize your schedule, use crontab.guru for formatting
      # Keep this false. Every container start (Docker/host restart, `compose up`) would otherwise run
      # the bot immediately — restarts come in bursts, giving several sign-ins within minutes at
      # arbitrary hours, outside the jittered schedule. Runs then only happen at the cron slots.
      - RUN_ON_START=false
      - TZ=Asia/Tokyo # Set your timezone for proper scheduling
      # Anti-detection: arm rebrowser's Runtime.enable patch (src/rebrowser-env.ts sets these as
      # defaults too; declared here so it's explicit/overridable in the deployed container).
      - REBROWSER_PATCHES_RUNTIME_FIX_MODE=addBinding
      - REBROWSER_PATCHES_UTILITY_WORLD_NAME=util